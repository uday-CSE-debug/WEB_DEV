<!-- Complex Form -->
<form>
<h2>Complex Form</h2>

<fieldset>
<legend>Personal Information</legend>

<label for="Name">Name</label>
<input type="text" name="Name" id="Name">
<label for="email">Email</label>
<input type="email" name="email" id="email">
<label for="Number">Phone </label>
<input type="tel" name="Number" id="Number">
<label for="datepicker">Date of Brith</label>
<input type="date" name="datepicker" id="datepicker">
<label>Gender</label>
<label for="button">Male</label>
<input type="radio" name="button" id="button">
<label for="button">Female</label>
<input type="radio" name="button" id="button">
<label>Country</label>
<br/>
<select name="Country" id="Country">
<option value="disable selected hidden">Choose your country</option>    
<option value="India">India</option>    
<option value="united states">United states</option>
<option value="united kingdom">United kingdom</option>
<option value="others">Others</option>

</select>

</fieldset>
<br/>

<fieldset>
<legend>Address</legend>
<label for="street">Street</label>
<input type="text" name="street" id="street">
<label for="city">City</label>
<input type="text" name="city" id="city">
<label for="state">State</label>
<input type="text" name="state" id="state">
<label for="number">Zin Code</label>
<input type="number" name="number" id="number">

</fieldset>
<br/>
<fieldset>
<legend>Other Information</legend>
<textarea name="comments" id="comments" cols="50" rows="4"></textarea>

<label for="checkbox">I agree terms of service</label>
<input type="checkbox" name="checkbox" id="checkbox">

</fieldset>
<input type="submit" name="submit" id="submit">
</form>
