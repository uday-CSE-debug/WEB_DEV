<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
        width:100%;
        height:100%;
        min-height: 100vh;
        background-color: #8BC6EC;
        background-image: linear-gradient(90deg, #8BC6EC 0%, #9599E2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        }
        .card {
            width: 360px;
            height: 500px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 5px;
        }
        .card img {
            height: 65%;
            border-radius: 10px;
        }
        .card h2 {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .card p {
            font-size: 1.7rem;  
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
        <img src="images/qrcode.png" alt="">
        <h2>Improve your front-End skills by building projects</h2>
        <p>Scan the QR code to get started!</p>
    </div>
    </div>
</body>
</html>
