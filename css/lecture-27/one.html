<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second card</title>
</head>
<style>
     *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
        width:100%;
        height:100%;
        min-height: 100vh;
        background-color: #8BC6EC;
        background-image: linear-gradient(90deg, #8BC6EC 0%, #9599E2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        }
        .card{
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }          
        .card img{
            width: 100%;
            height: 30%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;    
        }
        .textbox{
            display:flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 80%;
            font-size: 1.5rem;
            text-align: center;
        }
        #amountBox{
        width: 80%;
        height: 10%;
        background-color: #8BC6EC;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;    
        padding-right: 20px;
        padding-left: 20px;
        }
        #leftBox{
        height: fit-content;
        width: fit-content;
        display: flex;
        gap: 15px;
        }
        #rightBox{
        width: fit-content;
        height: fit-content;
        }
        .imgBox img{
        height: 80%;
        }
        #paymentButton{
        width: 80%;
        height: 10%;
        background-color: rgb(22,22, 79);
        color: white;
        border-radius: 10px;
        box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;        
        }
        .cancelBox a{
        text-decoration: none;
        color: rgb(59, 51, 51);
        font-weight: bold;
        font-size: large;
        }
</style>
<body>
    <div class="container">
    <div class="card">
    <img src="images/icon.jpg" alt="">
    <div class="textbox">
        <h2>Order Summary</h2>
        <p>hello, this is a simple order summary,let's take a look at what you've ordered have a great day!</p>
    </div>
    <div id ="amountBox">
        <div id="leftBox">
        <div class="imgBox">
            <img src="images/favicon-32x32.png" alt="">
        </div>    
        <div class="textAmountBox">
            <p>Amount</p>
            <p>$99.9/year</p>
        </div>
        </div>
        <div id="rightBox">
        <a href="#">Change</a>  
        </div>
    </div>
    <button id="paymentButton">Proceed to Payment</button>
    <div class="cancelBox">
        <a href="#">Cancel Order</a>
    </div>
    </div>
    </div>
</body>
</html>
