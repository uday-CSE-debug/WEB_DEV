<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
    border:solid black 2px;
    background-color:bisque;
    display: flex;
    flex-direction: row;
    width:400px;
    margin:10px;
    padding:2px;
    }

    #boxleft{
    border: solid blue 2px;
    background-color:aquamarine;
    width:50%;
    margin:3px;
    padding:2px;
    display: flex;
    flex-direction: column;
    }

    #boxright{
    background-color:yellow;
    border:solid brown 2px;
    width:47%;
    margin:3px;
    padding:2px;
    }
    p{
    border: solid red 2px;    
    }
    img{
    width:180px;
    }
@media (max-width:640px){
    .container{
    flex-direction:column;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div id="boxleft">
            <p>Text1</p>
            <p>Text2</p>
        </div>
        <div id="boxright">
            <img src="bhagat singh photo.jpg" alt="">
        </div>
    </div>
</body>
</html>
